<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cute Photobooth 🎀</title>
    <!-- Google Fonts for Y2K/Scrapbook vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- SCREEN 1: LANDING PAGE -->
        <div id="screen-landing" class="screen active">
            <div class="decor top-left">✨</div>
            <div class="decor top-right">🎀</div>
            <h1 class="scrapbook-font title-main">MY CUTE<br>PHOTOBOOTH</h1>
            <p class="subtitle">Capture your aesthetic Y2K moments! 📸💕</p>
            <button class="btn primary bounce" onclick="goToScreen('screen-frame')">START PHOTOBOOTH 📸</button>
            <div class="decor bottom-left">🌸</div>
            <div class="decor bottom-right">⭐</div>
        </div>

        <!-- SCREEN 2: CHOOSE FRAME -->
        <div id="screen-frame" class="screen hidden">
            <h2 class="scrapbook-font text-center">Choose Your Frame 🎀</h2>
            <div class="frame-grid">

    <div class="frame-card" data-frame="blue-denim" onclick="selectFrame(this)">
        <div class="frame-preview preview-blue-denim">
            <span>🎀</span>
        </div>
        <p>Blue Denim</p>
    </div>

    <div class="frame-card" data-frame="film-strip" onclick="selectFrame(this)">
        <div class="frame-preview preview-film-strip">
            <span>📷</span>
        </div>
        <p>Film Strip</p>
    </div>

    <div class="frame-card" data-frame="cute-pink" onclick="selectFrame(this)">
        <div class="frame-preview preview-cute-pink">
            <span>💗</span>
        </div>
        <p>Cute Pink</p>
    </div>

    <div class="frame-card" data-frame="universe" onclick="selectFrame(this)">
        <div class="frame-preview preview-universe">
            <span>🌌</span>
        </div>
        <p>Love You In Every Universe</p>
    </div>

</div>
            <button id="btn-continue-frame" class="btn primary mt-auto" onclick="startPhotoSession()" disabled>CONTINUE &rarr;</button>
        </div>

        <!-- SCREEN 3: SOURCE SELECTION (Camera or Upload) -->
        <div id="screen-source" class="screen hidden">
            <div class="progress-bar">
                <span id="photo-counter" class="scrapbook-font">PHOTO 1 / 3</span>
            </div>
            <h2 class="scrapbook-font text-center mt-20">How to add photo? 🤔</h2>
            <div class="source-options">
                <button class="btn secondary source-btn" onclick="openCamera()">
                    <span class="icon">📷</span><br>Use your camera
                </button>
                <button class="btn secondary source-btn" onclick="document.getElementById('file-upload').click()">
                    <span class="icon">🖼️</span><br>Choose from gallery
                </button>
                <input type="file" id="file-upload" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            </div>
        </div>

        <!-- SCREEN 4: CAMERA VIEW -->
        <div id="screen-camera" class="screen hidden">
            <h3 class="scrapbook-font text-center">Strike a pose! ✨</h3>
            <div class="camera-container">
                <video id="camera-video" autoplay playsinline></video>
                <div id="countdown-display" class="hidden scrapbook-font">3</div>
                <div id="flash-effect" class="hidden"></div>
            </div>
            
            <div class="filter-scroll">
                <button class="filter-btn active" onclick="setFilter('original')">Normal</button>
                <button class="filter-btn" onclick="setFilter('soft-pink')">Soft Pink</button>
                <button class="filter-btn" onclick="setFilter('dreamy')">Dreamy</button>
                <button class="filter-btn" onclick="setFilter('vintage')">Vintage</button>
                <button class="filter-btn" onclick="setFilter('bubblegum')">Bubblegum</button>
                <button class="filter-btn" onclick="setFilter('bw')">B & W</button>
            </div>

            <div class="camera-controls">
                <button id="btn-capture" class="btn capture-btn" onclick="takePhoto()">📸</button>
            </div>

            <div id="camera-preview-controls" class="hidden actions-row">
                <button class="btn secondary" onclick="retakePhoto()">RETAKE</button>
                <button class="btn primary" onclick="confirmPhoto()">USE PHOTO</button>
            </div>
        </div>

        <!-- SCREEN 5: UPLOAD PREVIEW -->
        <div id="screen-upload" class="screen hidden">
            <h3 class="scrapbook-font text-center">Looking good! 🎀</h3>
            <div class="upload-preview-container">
                <img id="upload-preview-img" src="" alt="Preview">
            </div>
            <div class="actions-row mt-20">
                <button class="btn secondary" onclick="document.getElementById('file-upload').click()">CHOOSE ANOTHER</button>
                <button class="btn primary" onclick="confirmPhoto()">USE PHOTO</button>
            </div>
        </div>

        <!-- SCREEN 6: FINAL RESULT -->
        <div id="screen-result" class="screen hidden">
            <h2 class="scrapbook-font text-center text-pink">YOUR PHOTO IS READY! 💗</h2>
            <div class="result-container">
                <img id="final-result-img" src="" alt="Final Photobooth">
            </div>
            <div class="actions-col mt-20">
                <button class="btn primary" onclick="downloadPhoto()">DOWNLOAD PHOTO 💾</button>
                <div class="actions-row">
                    <button class="btn secondary small" onclick="goToScreen('screen-frame'); resetSession()">Change Frame</button>
                    <button class="btn secondary small" onclick="resetSession(); startPhotoSession()">Retake All</button>
                </div>
            </div>
        </div>
        
        <!-- Hidden canvas for processing -->
        <canvas id="process-canvas" class="hidden"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
